[project]
name = "q-sharepoint-api"
version = "0.1.0"
description = "Fælles SharePoint API til RPA"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "automation-server-client",
]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.3.0" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["q_sharepoint_api"]
